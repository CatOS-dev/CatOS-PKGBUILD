[boot]
method = disabled
# Output root. Any directory is accepted and created as needed.
esp_path = /boot/efi
# Optional, caller-supplied firmware registration coordinates.
# Leave both unset to deploy files without accessing firmware variables.
efi_disk =
efi_partition = 0
# Directory within that partition corresponding to esp_path; supplied by the caller.
firmware_directory = /
label_prefix = CatOS
default_kernel = linux
# Write EFI/BOOT only when explicitly enabled.
install_fallback = no
