general {
  gaps_in = 5
  gaps_out = 10
}

decoration {
  rounding = 20
  rounding_power = 2

  shadow {
    enabled = true
    range = 4
    render_power = 3
    color = rgba(1a1a1aee)
  }

  blur {
    enabled = true
    size = 3
    passes = 2
    vibrancy = 0.1696
  }
}

# Start DMS from user service.
exec-once = systemctl --user start dms.service

# Core terminal bind
bind = SUPER, T, exec, ghostty
