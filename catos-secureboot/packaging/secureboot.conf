[secureboot]
esp_path = "/boot/efi"
boot_path = "/boot"
cmdline_path = "/etc/kernel/cmdline"
grub_dropin_path = "/etc/default/grub.d/90-catos-secureboot.cfg"
key_dir = "/var/lib/catos-secureboot/keys"
state_path = "/var/lib/catos-secureboot/state.json"
enrollment_password_path = "/var/lib/catos-secureboot/enrollment-password"
module_root = "/usr/lib/modules"
vendor_shim = "/usr/share/catos-secureboot/vendor/shimx64.efi"
vendor_mok_manager = "/usr/share/catos-secureboot/vendor/mmx64.efi"
efi_globs = [
  "EFI/CatOS/*.efi",
  "EFI/Linux/*.efi",
  "EFI/systemd/*.efi",
  "EFI/limine/*.efi",
]
kernel_globs = [
  "/usr/lib/modules/*/vmlinuz",
  "/boot/vmlinuz-*",
  "/boot/efi/*/*/linux",
  "/boot/efi/*/*/vmlinuz",
]
second_stage_candidates = [
  "EFI/systemd/systemd-bootx64.efi",
  "EFI/limine/limine_x64.efi",
  "EFI/limine/limine.efi",
  "EFI/CatOS/grubx64.efi",
]
module_directories = ["updates", "extramodules"]
efi_label = "CatOS Secure Boot"
register_efi = true
certificate_days = 36500
